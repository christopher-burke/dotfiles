- defaults:
    link:
      relink: true
      create: true
    shell:
      stdout: true
      stderr: true

- clean: ['~']

- create:
    - ~/bin
    - ~/.config
    - ~/.cache
    - ~/.local/share

- link:
    ~/.zshrc: .zshrc
    ~/.zprofile: .zprofile
    ~/.p10k.zsh: .p10k.zsh
    ~/.gitconfig: .gitconfig
    ~/.gitignore.global: .gitignore.global

- shell:
    - [chmod +x ./scripts/bootstrap.sh, Ensure bootstrap is executable]
    - [chmod +x ./scripts/doctor.sh, Ensure doctor is executable]
    - [./scripts/bootstrap.sh, Run one-time bootstrap]
    - [./scripts/doctor.sh, Validate environment]